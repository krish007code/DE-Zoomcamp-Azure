version: "3"

volumes:
  ny_taxi_postgres_data:
    driver: local
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local

services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ny_taxi
    ports:
      - "5432:5432"
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql

  # INTERNAL KESTRA DATABASE
  kestra_postgres:
    image: postgres:18
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4

  kestra:
    image: kestra/kestra:v1.1
    pull_policy: always
    user: "root"
    command: server standalone
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      ENV_AZURE_STORAGE_CONNECTION: $[AZURE_KEY]
      ENV_AZURE_STORAGE_ENDPOINT: "https://zoomcampstorage.blob.core.windows.net"
      SECRET_AZURE_SQL_PASSWORD: "WW91clBhc3N3b3JkMTIz" 
      ENV_AZURE_SQL_URL: "jdbc:sqlserver://zoomcamp-server.database.windows.net:1433;database=zoomcamp-database;user=CloudSA124dcc9a;password=Azure@1234;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;"

      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            username: kestra
            password: k3str4
        kestra:
          variables:
            zoomcamp:
              AZURE_SQL_URL: "jdbc:sqlserver://zoomcamp-server.database.windows.net:1433;database=zoomcamp-database;user=CloudSA124dcc9a;"
          server:
            basicAuth:
              username: "admin@kestra.io"
              password: Admin1234!
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
    ports:
      - "8080:8080"
    depends_on:
      kestra_postgres:
        condition: service_started